name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch:      # Allows manual run

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/SoulSeekkor/LegionCore-7.3.5.git

      - name: Fetch upstream changes
        run: git fetch upstream

      - name: Merge upstream branch
        run: git merge upstream/merged

      - name: Push changes to your fork
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: git push https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }} HEAD:main
